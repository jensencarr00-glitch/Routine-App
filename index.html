<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routine</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0b">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b0b0b;--text:#d6d6d6;--mute:#8a8a8a;--acc:#ff5c4d;--line:#585858;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;font-family:"Courier New",Courier,monospace!important;border-radius:0!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-size:16px;-webkit-text-size-adjust:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{padding:14px 14px calc(70px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
h1{font-size:18px;color:var(--acc);letter-spacing:1px;margin:6px 0 12px}
.art{color:var(--acc);font-size:13px;line-height:1.1;margin:4px 0 6px}
.card{border:1px dashed var(--line);padding:10px 12px;margin-bottom:10px}
.next{border:1px solid var(--acc)}.done{opacity:.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tip{font-size:13px;color:var(--mute)}.rd{color:var(--acc)}
button{background:none;border:0;color:var(--acc);font-size:14px;padding:6px 4px;text-decoration:underline}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:3ch;height:1.3em;margin:0;background:none;border:0;vertical-align:middle;flex:none}
input[type=checkbox]::before{content:"[ ]";color:var(--mute)}input[type=checkbox]:checked::before{content:"[x]";color:var(--acc)}
input[type=text],input[type=time],input[type=number]{background:#111;color:var(--text);border:1px dashed var(--line);font-size:16px;padding:8px;width:100%}
.t{color:var(--acc);flex:none;width:6ch}
.w{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px dashed var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;height:50px;text-decoration:none;color:var(--mute);letter-spacing:1px;padding:0}nav button.on{color:var(--acc)}
</style>
</head>
<body>
<main id="app"></main>
<nav><button id="t1">[TODAY]</button><button id="t2">[WEEK]</button><button id="t3">[EDIT]</button></nav>
<script>
var IC={sleep:"zz",water:"~",study:"##",social:"@",eat:"*",free:"+",move:">"};
var DEF=[{id:1,t:"10:00",n:"Wake up, 250ml water, open the curtains",c:"sleep"},{id:2,t:"10:30",n:"Breakfast: porridge, banana, peanut butter (581 kcal)",c:"eat"},{id:3,t:"11:00",n:"Study block 1 (90 min, phone away)",c:"study"},{id:4,t:"12:30",n:"Walk 30 min outside",c:"move"},{id:5,t:"13:15",n:"Free time and chores",c:"free"},{id:6,t:"14:00",n:"Lunch from your meal plan",c:"eat"},{id:7,t:"15:00",n:"Study block 2 (60-90 min)",c:"study"},{id:8,t:"16:30",n:"Banana snack and a glass of water",c:"eat"},{id:9,t:"17:00",n:"Social: message, call or see someone",c:"social"},{id:10,t:"19:00",n:"Dinner from your meal plan",c:"eat"},{id:11,t:"20:00",n:"Free time (games, TV, hobbies)",c:"free"},{id:12,t:"22:30",n:"Tick off meals and plan tomorrow (10 min)",c:"free"},{id:13,t:"00:45",n:"Wind down: dim screens, no caffeine, water by the bed",c:"sleep"},{id:14,t:"01:30",n:"Lights out (8.5 hours of sleep)",c:"sleep"}];
var S,tab=1;
try{S=JSON.parse(localStorage.getItem("rt1"))}catch(e){}
if(!S||!S.r||!S.days)S={r:JSON.parse(JSON.stringify(DEF)),days:{},wt:2000};
function save(){try{localStorage.setItem("rt1",JSON.stringify(S))}catch(e){}}
function key(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function day(k){return S.days[k]||(S.days[k]={d:{},w:0})}
function mins(t){var a=(t||"0:0").split(":");return+a[0]*60+ +a[1]}
function ord(t){var m=mins(t);return m<360?m+1440:m}
function list(){return S.r.slice().sort(function(a,b){return ord(a.t)-ord(b.t)})}
function pct(k){var dd=S.days[k]||{d:{}},en=S.r.filter(function(b){return b.on!==false}),n=en.filter(function(b){return dd.d[b.id]}).length;return en.length?Math.round(100*n/en.length):0}
function bar(p,w){var n=Math.max(0,Math.min(w,Math.round(p/100*w)));return"["+"#".repeat(n)+"-".repeat(w-n)+"]"}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function today(){
 var k=key(),dd=day(k),nw=new Date(),nm=nw.getHours()*60+nw.getMinutes();nm=nm<360?nm+1440:nm;
 var L=list().filter(function(b){return b.on!==false}),nx=-1;
 for(var i=0;i<L.length;i++)if(!dd.d[L[i].id]&&ord(L[i].t)>=nm-30){nx=i;break}
 if(nx<0)for(i=0;i<L.length;i++)if(!dd.d[L[i].id]){nx=i;break}
 var p=pct(k),wp=Math.round(100*dd.w/S.wt);
 var h='<pre class="art">'+[" .-----------.","|   12:00    |","|  [x] [ ]   |"," '-----------'"," zz  ~  >  ## "].join("\n")+'</pre><h1>== TODAY ==</h1>';
 h+='<div class="card"><b>> PROGRESS</b><div class="tip" style="margin-top:6px">'+bar(p,20)+' '+p+'%</div></div>';
 h+='<div class="card"><b>> WATER</b><div class="tip" style="margin-top:6px">'+bar(wp,20)+' '+dd.w+' / '+S.wt+'ml</div><div class="w"><button data-w="250">[+250ml]</button><button data-w="100">[+100ml]</button><button data-w="-250">[-250ml]</button></div></div>';
 L.forEach(function(b,i){h+='<div class="card'+(dd.d[b.id]?' done':'')+(i===nx?' next':'')+'"><div class="row"><input type="checkbox" data-b="'+b.id+'"'+(dd.d[b.id]?' checked':'')+'><span class="t">'+esc(b.t)+'</span><span style="flex:1">'+esc(b.n)+'</span><span class="tip">'+(IC[b.c]||"")+'</span></div>'+(i===nx?'<div class="tip rd" style="margin-top:4px">&gt; next up</div>':'')+'</div>'});
 return h}
function week(){
 var h='<h1>== WEEK ==</h1>',tot=0,st=0,run=0,nm=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
 for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=key(d),p=pct(k),w=(S.days[k]||{w:0}).w;tot+=p;
  h+='<div class="card"><div class="row"><b>'+nm[d.getDay()]+' '+k.slice(5)+'</b><span class="tip">'+p+'%</span></div><div class="tip" style="margin-top:6px">'+bar(p,20)+'</div><div class="tip">water '+bar(Math.round(100*w/S.wt),10)+' '+w+'ml</div></div>'}
 for(i=0;i<60;i++){var d2=new Date();d2.setDate(d2.getDate()-i);if(pct(key(d2))>=70)run++;else if(i>0)break;else if(i===0)continue}
 return h+'<div class="card"><b>> SUMMARY</b><div class="tip" style="margin-top:6px">7-day average: '+Math.round(tot/7)+'%<br>Streak of days at 70% or more: '+run+'</div></div>'}
function edit(){
 var h='<h1>== EDIT ==</h1><p class="tip">Change times, names or switch blocks off. Times before 06:00 count as late night.</p><div class="card"><span class="tip">Water target (ml)</span><input type="number" id="wt" value="'+S.wt+'" inputmode="numeric"></div>';
 list().forEach(function(b){h+='<div class="card"><div class="row"><input type="checkbox" data-on="'+b.id+'"'+(b.on!==false?' checked':'')+'><input type="time" data-t="'+b.id+'" value="'+esc(b.t)+'" style="width:130px"><button data-x="'+b.id+'">[delete]</button></div><input type="text" data-n="'+b.id+'" value="'+esc(b.n)+'" style="margin-top:6px"></div>'});
 return h+'<button id="add">[+ add block]</button><br><button id="rs" class="tip">[reset routine]</button>'}
function render(){var y=window.scrollY;document.getElementById("app").innerHTML=tab===1?today():tab===2?week():edit();
 for(var i=1;i<4;i++)document.getElementById("t"+i).className=tab===i?"on":"";window.scrollTo(0,y);bind()}
function bind(){var q=function(s){return document.querySelectorAll(s)};
 q("[data-b]").forEach(function(e){e.onchange=function(){day(key()).d[e.dataset.b]=e.checked?1:0;save();render()}});
 q("[data-w]").forEach(function(e){e.onclick=function(){var d=day(key());d.w=Math.max(0,d.w+(+e.dataset.w));save();render()}});
 q("[data-on]").forEach(function(e){e.onchange=function(){S.r.forEach(function(b){if(b.id==e.dataset.on)b.on=e.checked});save()}});
 q("[data-t]").forEach(function(e){e.onchange=function(){S.r.forEach(function(b){if(b.id==e.dataset.t&&e.value)b.t=e.value});save();render()}});
 q("[data-n]").forEach(function(e){e.onchange=function(){S.r.forEach(function(b){if(b.id==e.dataset.n)b.n=e.value});save()}});
 q("[data-x]").forEach(function(e){e.onclick=function(){if(confirm("Delete this block?")){S.r=S.r.filter(function(b){return b.id!=e.dataset.x});save();render()}}});
 var a=document.getElementById("add");if(a)a.onclick=function(){var m=0;S.r.forEach(function(b){m=Math.max(m,b.id)});S.r.push({id:m+1,t:"12:00",n:"New block",c:"free"});save();render()};
 var r=document.getElementById("rs");if(r)r.onclick=function(){if(confirm("Reset the routine to the suggested one?")){S.r=JSON.parse(JSON.stringify(DEF));save();render()}};
 var w=document.getElementById("wt");if(w)w.onchange=function(){S.wt=Math.max(250,+w.value||2000);save()}}
[1,2,3].forEach(function(k){document.getElementById("t"+k).onclick=function(){tab=k;window.scrollTo(0,0);render()}});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
